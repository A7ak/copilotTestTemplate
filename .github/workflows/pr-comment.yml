name: PR Comment for Test Scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze Changes
        id: analysis
        run: |
          # Get list of changed files
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          # Initialize counts and lists
          UI_COUNT=0
          LOGIC_COUNT=0
          RES_COUNT=0
          TEST_COUNT=0
          MANIFEST_COUNT=0
          
          TABLE_ROWS=""
          
          for file in $FILES; do
            TYPE="Other"
            IMPACT="Low"
            
            if [[ $file == *".kt"* ]] || [[ $file == *".java"* ]]; then
              if [[ $file == *"Test"* ]]; then
                TYPE="Test"
                IMPACT="None (Internal)"
                TEST_COUNT=$((TEST_COUNT+1))
              elif grep -q "@Composable" "$file" 2>/dev/null || grep -q "Activity" "$file" 2>/dev/null; then
                TYPE="UI/Logic"
                IMPACT="High (Visual/Flow)"
                UI_COUNT=$((UI_COUNT+1))
              else
                TYPE="Business Logic"
                IMPACT="Medium (Functional)"
                LOGIC_COUNT=$((LOGIC_COUNT+1))
              fi
            elif [[ $file == *"xml"* ]]; then
              if [[ $file == *"AndroidManifest.xml"* ]]; then
                TYPE="Manifest"
                IMPACT="Critical (Config)"
                MANIFEST_COUNT=$((MANIFEST_COUNT+1))
              else
                TYPE="Resource"
                IMPACT="Medium (Layout/Strings)"
                RES_COUNT=$((RES_COUNT+1))
              fi
            elif [[ $file == *".gradle"* ]]; then
              TYPE="Build Script"
              IMPACT="High (Dependency)"
            fi
            
            TABLE_ROWS="$TABLE_ROWS| \`$file\` | $TYPE | $IMPACT |"$'\n'
          done

          # Limit table size if too many files
          TOTAL_FILES=$(echo "$FILES" | wc -l)
          if [ "$TOTAL_FILES" -gt 20 ]; then
             TABLE_ROWS=$(echo "$TABLE_ROWS" | head -n 20)
             TABLE_ROWS="$TABLE_ROWS| ... and $((TOTAL_FILES-20)) more files | - | - |"
          fi

          echo "table_rows<<EOF" >> $GITHUB_OUTPUT
          echo "$TABLE_ROWS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "summary=| UI/Logic | $UI_COUNT |" >> $GITHUB_OUTPUT
          echo "summary_logic=| Business Logic | $LOGIC_COUNT |" >> $GITHUB_OUTPUT
          echo "summary_res=| Resources | $RES_COUNT |" >> $GITHUB_OUTPUT
          echo "summary_test=| Tests | $TEST_COUNT |" >> $GITHUB_OUTPUT

      - name: Add comment to PR
        run: |
          cat <<EOF > comment.md
          ### 🧪 QA Test Scope Analysis
          
          #### 📊 Impact Summary
          | Category | File Count |
          | :--- | :--- |
          ${{ steps.analysis.outputs.summary }}
          ${{ steps.analysis.outputs.summary_logic }}
          ${{ steps.analysis.outputs.summary_res }}
          ${{ steps.analysis.outputs.summary_test }}
          
          #### 📂 Detailed File Analysis
          | File Path | Type | Impact Level |
          | :--- | :--- | :--- |
          ${{ steps.analysis.outputs.table_rows }}
          
          **🛠 Recommended QA Actions:**
          1. **Regression**: Verify if existing flows are affected by logic changes.
          2. **UI Check**: If UI/Resource count > 0, perform a visual sweep on multiple devices.
          3. **Manifest**: If Manifest changes exist, check for permission or launch changes.
          4. **Unit Tests**: Ensure Test count matches logic complexity.
          EOF
          
          # Remove previous bot comment to keep thread clean
          OLD_COMMENT=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select(.body | contains("QA Test Scope Analysis")) | .id' | head -n 1)
          if [ -n "$OLD_COMMENT" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$OLD_COMMENT" || echo "Old comment could not be deleted."
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
