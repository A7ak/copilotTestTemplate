name: PR Comment for Test Scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed files and format as markdown list
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | head -n 50 | sed 's/^/- /')
          if [ $(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | wc -l) -gt 50 ]; then
            FILES="$FILES"$'\n'- ... and more files
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Add comment to PR
        run: |
          cat <<EOF > comment.md
          ### 🧪 QA Test Scope Analysis
          The following files have been modified in this PR:
          
          ${{ steps.changed-files.outputs.files }}
          
          **Testing Guidance:**
          - Ensure all relevant unit tests, integration tests, and UI tests are updated or added.
          - Verify business logic changes in the modified files.
          - Check for regressions in modules depending on these files.
          EOF
          
          # Remove previous bot comment to keep thread clean
          OLD_COMMENT=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select(.body | contains("QA Test Scope Analysis")) | .id' | head -n 1)
          if [ -n "$OLD_COMMENT" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$OLD_COMMENT" || echo "Old comment could not be deleted (may not exist)."
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
