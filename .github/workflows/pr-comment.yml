name: Update PR Testing Scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  update-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze Changes
        id: analysis
        run: |
          # Get list of changed files
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          # Initialize summary components
          UI_SUMMARY=""
          LOGIC_SUMMARY=""
          RES_SUMMARY=""
          BUILD_SUMMARY=""
          MANIFEST_SUMMARY=""
          
          # Filter files for categorization
          UI_FILES=$(echo "$FILES" | grep -iE "Activity|Fragment|@Composable|View" || true)
          LOGIC_FILES=$(echo "$FILES" | grep -v "Test" | grep -E "\.kt$|\.java$" | grep -vEi "Activity|Fragment|View" || true)
          RES_FILES=$(echo "$FILES" | grep "\.xml$" | grep -v "AndroidManifest" || true)
          BUILD_FILES=$(echo "$FILES" | grep -E "\.gradle|\.properties|\.pro" || true)
          MANIFEST_FILES=$(echo "$FILES" | grep "AndroidManifest.xml" || true)

          # Build summary strings
          [ -n "$UI_FILES" ] && UI_SUMMARY="- **UI/Flow**: $(echo "$UI_FILES" | wc -l | xargs) visual/entry-point files modified."
          [ -n "$LOGIC_FILES" ] && LOGIC_SUMMARY="- **Business Logic**: $(echo "$LOGIC_FILES" | wc -l | xargs) core logic files touched."
          [ -n "$RES_FILES" ] && RES_SUMMARY="- **Resources**: $(echo "$RES_FILES" | wc -l | xargs) XML/Asset files changed."
          [ -n "$BUILD_FILES" ] && BUILD_SUMMARY="- **Build/Config**: Infrastructure or dependency changes detected."
          [ -n "$MANIFEST_FILES" ] && MANIFEST_SUMMARY="- **Manifest**: System configuration/Permissions modified (Critical)."

          {
            echo "scope_block<<EOF"
            echo "<!-- SCOPE_START -->"
            echo "## 🧪 Overall Testing Scope"
            echo "### 📊 Summary of Impact"
            [ -n "$MANIFEST_SUMMARY" ] && echo "$MANIFEST_SUMMARY"
            [ -n "$UI_SUMMARY" ] && echo "$UI_SUMMARY"
            [ -n "$LOGIC_SUMMARY" ] && echo "$LOGIC_SUMMARY"
            [ -n "$RES_SUMMARY" ] && echo "$RES_SUMMARY"
            [ -n "$BUILD_SUMMARY" ] && echo "$BUILD_SUMMARY"
            
            echo ""
            echo "### 🛠 Recommended QA Focus"
            [ -n "$MANIFEST_FILES" ] && echo "- [ ] **System**: Verify permission changes or new Activity declarations."
            [ -n "$UI_FILES" ] && echo "- [ ] **Visual**: Perform a visual regression sweep on affected UI components."
            [ -n "$LOGIC_FILES" ] && echo "- [ ] **Functional**: Verify business logic flows and handle potential edge cases."
            [ -n "$BUILD_FILES" ] && echo "- [ ] **Stability**: Ensure the app builds and launches correctly after dependency updates."
            
            echo ""
            echo "> _Updated automatically by QA Bot 🤖 on $(date +'%Y-%m-%d %H:%M')_"
            echo "<!-- SCOPE_END -->"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR Description
        run: |
          # Fetch the current PR body
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')
          
          # Inject or update the Testing Scope section using markers
          if echo "$PR_BODY" | grep -q "<!-- SCOPE_START -->"; then
            # Replace existing block
            echo "$PR_BODY" | perl -0777 -pe 's/<!-- SCOPE_START -->.*?<!-- SCOPE_END -->/${{ steps.analysis.outputs.scope_block }}/s' > new_body.md
          else
            # Append to the bottom if not present
            echo -e "$PR_BODY\n\n${{ steps.analysis.outputs.scope_block }}" > new_body.md
          fi
          
          # Edit the PR
          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
