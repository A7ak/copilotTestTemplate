name: Update PR Testing Scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  update-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze Changes
        id: analysis
        run: |
          # Get list of changed files, filtering out IDE and CI config files
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -vEi "^\.idea/|^\.github/" || true)
          
          # Initialize summary components
          UI_COUNT=0
          LOGIC_COUNT=0
          RES_COUNT=0
          BUILD_COUNT=0
          MANIFEST_COUNT=0
          
          UI_LIST=""
          LOGIC_LIST=""
          MANIFEST_LIST=""
          BUILD_LIST=""

          for file in $FILES; do
            # Skip deleted files for content analysis
            if [ ! -f "$file" ]; then continue; fi

            if [[ $file == *".kt"* ]] || [[ $file == *".java"* ]]; then
              if [[ $file == *"Test"* ]]; then
                continue # Ignore tests from count
              elif grep -qE "@Composable|Activity|Fragment|View" "$file" 2>/dev/null; then
                UI_COUNT=$((UI_COUNT+1))
                UI_LIST="$UI_LIST- $file\n"
              else
                LOGIC_COUNT=$((LOGIC_COUNT+1))
                LOGIC_LIST="$LOGIC_LIST- $file\n"
              fi
            elif [[ $file == *"AndroidManifest.xml"* ]]; then
              MANIFEST_COUNT=$((MANIFEST_COUNT+1))
              MANIFEST_LIST="$MANIFEST_LIST- $file\n"
            elif [[ $file == *"xml"* ]]; then
              RES_COUNT=$((RES_COUNT+1))
            elif [[ $file == *".gradle"* ]] || [[ $file == *".properties"* ]] || [[ $file == *".pro"* ]]; then
              BUILD_COUNT=$((BUILD_COUNT+1))
              BUILD_LIST="$BUILD_LIST- $file\n"
            fi
          done

          # Build summary block
          {
            echo "scope_block<<EOF"
            echo "<!-- SCOPE_START -->"
            echo "## 🧪 Overall Testing Scope"
            echo "### 📊 Summary of Impact"
            [ $MANIFEST_COUNT -gt 0 ] && echo "- **Manifest**: $MANIFEST_COUNT system/permission changes (Critical)."
            [ $UI_COUNT -gt 0 ] && echo "- **UI/Flow**: $UI_COUNT visual/entry-point files modified."
            [ $LOGIC_COUNT -gt 0 ] && echo "- **Business Logic**: $LOGIC_COUNT core logic files touched."
            [ $RES_COUNT -gt 0 ] && echo "- **Resources**: $RES_COUNT XML/Asset files changed."
            [ $BUILD_COUNT -gt 0 ] && echo "- **Build/Config**: Infrastructure or dependency changes detected."
            
            echo ""
            echo "### 🛠 Recommended QA Focus"
            [ $MANIFEST_COUNT -gt 0 ] && echo "- [ ] **System**: Verify permission changes or new Activity declarations."
            [ $UI_COUNT -gt 0 ] && echo "- [ ] **Visual**: Perform a visual regression sweep on affected UI components."
            [ $LOGIC_COUNT -gt 0 ] && echo "- [ ] **Functional**: Verify business logic flows and handle potential edge cases."
            [ $BUILD_COUNT -gt 0 ] && echo "- [ ] **Stability**: Ensure the app builds and launches correctly after dependency updates."
            
            echo ""
            echo "> _Updated automatically by QA Bot 🤖 on $(date +'%Y-%m-%d %H:%M')_"
            echo "<!-- SCOPE_END -->"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR Description
        env:
          SCOPE_BLOCK: ${{ steps.analysis.outputs.scope_block }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch current PR body
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')
          
          # 2. Update or Append the block using environment variables in Perl to avoid escaping issues
          if echo "$PR_BODY" | grep -q "<!-- SCOPE_START -->"; then
            # Replace existing block
            printf "%s" "$PR_BODY" | SCOPE_REPLACEMENT="$SCOPE_BLOCK" perl -0777 -pe 's/<!-- SCOPE_START -->.*?<!-- SCOPE_END -->/$ENV{SCOPE_REPLACEMENT}/s' > new_body.md
          else
            # Append to the bottom if not present
            printf "%s\n\n%s" "$PR_BODY" "$SCOPE_BLOCK" > new_body.md
          fi
          
          # 3. Save and Edit
          gh pr edit ${{ github.event.pull_request.number }} --body-file new_body.md
